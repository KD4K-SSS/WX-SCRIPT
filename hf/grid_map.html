<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maidenhead Field Grid Overlay (2-Character)</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-blue: #58a6ff;
            --accent-gold: #f0883e;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .map-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .map-header h2 {
            margin: 0;
            color: var(--accent-gold);
            font-size: 1.3rem;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            background-color: #050d1a;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .grid-line {
            stroke: #30363d;
            stroke-width: 0.5;
            stroke-dasharray: 2, 2;
        }

        .field-label {
            fill: #58a6ff;
            font-family: monospace;
            font-size: 8px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
            opacity: 0.75;
            pointer-events: none;
        }

        .field-rect {
            fill: transparent;
            stroke: #21262d;
            stroke-width: 0.5;
            transition: fill 0.15s ease;
        }

        .field-rect:hover {
            fill: rgba(88, 166, 255, 0.15);
            stroke: var(--accent-blue);
            stroke-width: 1;
            cursor: pointer;
        }

        .info-legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="map-card">
    <div class="map-header">
        <h2>Global Maidenhead Field Reference (2-Character Grid)</h2>
        <span style="font-size: 0.85rem; color: var(--text-dim);">Fields: 20° Longitude × 10° Latitude</span>
    </div>

    <div class="map-wrapper">
        <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg" id="maidenhead-map">
            
            <g fill="#16222f" stroke="#26384d" stroke-width="0.5">
                <path d="M 30,30 L 70,25 L 110,35 L 120,55 L 105,75 L 85,85 L 65,70 L 45,55 Z"/>
                <path d="M 100,95 L 125,100 L 135,120 L 120,155 L 110,140 L 95,115 Z"/>
                <path d="M 170,30 L 210,25 L 215,50 L 180,55 L 165,45 Z"/>
                <path d="M 165,60 L 215,60 L 230,90 L 200,140 L 175,120 L 160,85 Z"/>
                <path d="M 215,25 L 310,20 L 325,55 L 290,85 L 250,75 L 215,50 Z"/>
                <path d="M 290,110 L 330,110 L 335,140 L 295,140 Z"/>
            </g>

            <g id="grid-fields-group"></g>

        </svg>
    </div>

    <div class="info-legend">
        <div class="legend-item">
            <div class="color-box" style="background: rgba(88, 166, 255, 0.3); border: 1px solid var(--accent-blue);"></div>
            <span>Hover Field to Highlight</span>
        </div>
        <div class="legend-item">
            <span><strong>X-Axis (Longitude):</strong> A to R (West to East)</span>
        </div>
        <div class="legend-item">
            <span><strong>Y-Axis (Latitude):</strong> A to R (South to North)</span>
        </div>
    </div>
</div>

<script>
    // Generate the 18x18 Maidenhead Field Grid Programmatically
    const fieldsGroup = document.getElementById('grid-fields-group');
    const chars = "ABCDEFGHIJKLMNOPQR";

    // 18 columns (20 deg lon each), 18 rows (10 deg lat each)
    for (let lonIdx = 0; lonIdx < 18; lonIdx++) {
        for (let latIdx = 0; latIdx < 18; latIdx++) {
            const fieldName = chars[lonIdx] + chars[latIdx];
            
            // Map coordinates: X starts at 0 (-180°), Y starts at 0 (+90° North down to -90° South)
            const x = lonIdx * 20;
            const y = (17 - latIdx) * 10; // Invert Y axis for SVG

            // Field Rectangle
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", x);
            rect.setAttribute("y", y);
            rect.setAttribute("width", 20);
            rect.setAttribute("height", 10);
            rect.setAttribute("class", "field-rect");
            
            // Tooltip title
            const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
            title.textContent = `Maidenhead Field: ${fieldName}`;
            rect.appendChild(title);

            // Text Label (e.g., EM, EN, FN)
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", x + 10);
            text.setAttribute("y", y + 5);
            text.setAttribute("class", "field-label");
            text.textContent = fieldName;

            fieldsGroup.appendChild(rect);
            fieldsGroup.appendChild(text);
        }
    }
</script>

</body>
</html>
